<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8">
    <title>筑高古文単語</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">    
</head>
    <body>
        <section id="home">
            <div class="version">version 1.0.0</div>
            <div id="homebutton">
                <img src="./images/home.png" id="home-icon">
                <div id="title">
                    古文単語３１５四訂版
                    <br>
                    <span class="redH">読</span>んで<span class="redH">見</span>て<span class="redH">聞</span>いて<span class="H">覚</span>える
                </div>
            </div>
            <div class="containers">
                <div class="home-container">
                    <div id="progress">
                        <div id="progress-msg">
                        <div class="progress-text1">進捗(関連語含む)</div>
                        <div class="progress-text2"><span id="progress-per">0</span>%</div>
                        <div class="progress-text1"><span id="progress-num">0</span>語完了</div>
                        </div>
                    </div>
                </div>
                <ul class="error-msgs" id="error-msgs"></ul>
                <div class="preferences">
                    <label for="range-min , range-max" class="range-label">出題範囲(1~315)<span class="redH" style="font-size: 1em;">[必須]</span></label>
                    <div class="range">
                        <input type="number" required autocomplete="off" min="1" max="315" class="range-input input" id="range-min" />
                        <span class="range-label" style="font-size: 2vh;"> ~ </span>
                        <input type="number" required autocomplete="off" min="1" max="315" class="range-input input" id="range-max" />
                    </div>
                    <div class="range preview-range">
                        <div id="start-word"></div>
                        <span class="range-label" style="font-size: 2vh; position: absolute; left: 50%; transform: translateX(-50%);"> ~ </span>
                        <div id="end-word"></div>
                    </div>
                    <details class="select">
                        <summary>章と品詞で範囲を指定する</summary>
                        <div class="select">
                            <label for="range-select-section">出題する範囲:</label>
                            <select name="range-fromSection" id="range-select-section" style="font-size: max(1.5vh, 20px);">
                                <option value="">--選択</option>
                                <option value="all">全て</option>
                                <option value="c1">第一章 - 最重要語</option>
                                <option value="c2">第二章 - 重要語</option>
                                <option value="c3">敬語の章</option>
                            </select>
                            <label for="range-select-PoS">出題する品詞:</label>
                            <select name="range-fromSection-Pos" id="range-select-PoS" style="font-size: max(1.5vh, 20px);">
                                <option value="">--選択</option>
                                <option value="all">全て</option>
                                <option value="v" id="v">動詞</option>
                                <option value="adj" id="adj">形容詞</option>
                                <option value="adjv" id="adjv">形容動詞</option>
                                <option value="n" id="n">名詞</option>
                                <option value="adv" id="adv">副詞</option>
                            </select>
                        </div>
                    </details>
                    <div style="width: fit-content; align-self: center;">
                        <div class="flex" style="margin: auto; margin-top: 0.5vh;">
                            <input type="checkbox" id="cb-shuffle" class="input" />
                            <label for="cb-shuffle" class="label">出題順をシャッフル</label>
                        </div>
                        <div class="flex" style="margin: auto; margin-top: 0.5vh;">
                            <input type="checkbox" id="cb-include-relation" class="input" checked />
                            <label for="cb-shuffle" class="label">関連語を出題する</label>
                        </div>
                    </div>
                </div>
                <div class="flex">
                    <div class="option" id="flashcard">
                        <div class="opt-txt">
                            <span class="opt-txt-H">単語カード</span>
                            <br>
                            <div class="sub-opt-txt">flashcards</div>
                            <div class="border"></div>
                        </div>
                        <div class="preferences-checkbox">
                            <div class="label" style="font-size: max(1.8vh, 24px);">オプション</div>
                            <div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-except-known" class="input" />
                                    <label for="cb-except-known" class="label">既知の単語を除外</label>
                                </div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-show-meaning-first" class="input" />
                                    <label for="cb-show-meaning-first" class="label">意味を先に表示</label>
                                </div>
                            </div>
                        </div>
                        <button id="start-btn-flashcard" class="start-btn">スタート</button>
                    </div>
                    <div class="option" id="card">
                        <div class="opt-txt">
                            <span class="opt-txt-H">クイズ</span>
                            <br>
                            <div class="sub-opt-txt">quiz</div>
                            <div class="border"></div>
                        </div>
                        <div class="preferences">
                            <div class="preferences-checkbox">
                            <div class="label" style="font-size: max(1.8vh, 24px);">オプション(出題形式)</div>
                            <div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-four-option" class="input" checked />
                                    <label for="cb-four-option" class="label">4択問題</label>
                                </div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-typing" class="input" />
                                    <label for="cb-typing" class="label">タイピング問題</label>
                                </div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-fill-four-option" class="input" />
                                    <label for="cb-fill-four-option" class="label">穴埋め4択問題</label>
                                </div>
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 1vw;">
                                    <input type="checkbox" id="cb-fill-typing" class="input" />
                                    <label for="cb-fill-typing" class="label">穴埋めタイピング問題</label>
                                </div>
                            </div>
                            </div>
                            <div class="select">
                                <div class="flex" style="margin-top: 0.5vh; margin-left: 2vw;">
                                    <input type="checkbox" id="cb-fill-highlight" class="input" checked disabled />
                                    <label for="cb-fill-highlight" class="label">穴埋め問題で出題箇所を<br>ハイライトする</label>
                                </div>
                            </div>
                        </div>
                        <button id="start-btn-quiz" class="start-btn">スタート</button>
                    </div>
                </div>
            </div>
        </section>
        <script src = "home_main.js"></script>
        <link rel="stylesheet" href="home_style.css">
    </body>
</html>

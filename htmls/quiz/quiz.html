<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8">
    <title>筑高古文単語</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">    
</head>
    <body>
        <div class="version">version 1.0.0</div>
            <div id="homebutton">
                <img src="./images/home.png" id="home-icon">
                <div id="title">
                    古文単語３１５四訂版
                    <br>
                    <span class="redH">読</span>んで<span class="redH">見</span>て<span class="redH">聞</span>いて<span class="H">覚</span>える
                </div>
            </div>
        <section id="quiz">
            <div id="quiz-history-overlay" class="overlay">
                <div id="quiz-history-overlay-inner-message" class="overlay-inner-message">
                    <div>正答数 / 問題数</div>
                    <div style="font-size: 1.6em;"><span id="correct-answers-num">123</span> / <span id="answers-num">132</span></div>
                    <div><span id="consecutive-correct-answers-num">12</span>問連続正解！</div>
                </div>
                <div id="quiz-history-overlay-inner" class="overlay-inner"></div>
            </div>
            <div class="flex progress-bar-container">
                <div class="progress-bar-border">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="progress-bar-num-background">
                    <div id= "progress-bar-num"></div>
                </div>
            </div>
            <div class="column" >
                <div class="quiz-UI-container">
                    <button id="quiz-highlight" class="opt-btn">"</button>
                    <button id="quiz-history" class="hist-btn" style="margin-left: auto;">履歴を見る</button>
                </div>
                <div class="quiz-container" style="transform: scale(0.8);">
                    <div id="question" class="question-text">sampleText-id="question"</div>
                    <div id="translation" class="question-text">sampleText-id="translation"</div>
                    <!--四択用-->
                    <div id="four-option" class="four-option-container hidden">
                        <button id="opt1" class="four-option">text</button>
                        <button id="opt2" class="four-option">text</button>
                        <button id="opt3" class="four-option">text</button>
                        <button id="opt4" class="four-option">text</button>
                        <button id="optIDK" class="four-option" style="margin-top: 3vh;">わからない</button>
                    </div>
                    <!--タイピング問題用-->
                    <input id="answer-typing" class="question-obj" placeholder="意味を入力" autocomplete="off">
                    <button id="check" class="question-submit">答え合わせ</button>

                    <div id="result" class="question-msg-text">sampleText-id="result"</div>
                </div>
            </div>
        </section>
        <link rel="stylesheet" href="quiz_style.css">
        <script src = "quiz_main.js"></script>
    </body>
</html>
